<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小阅读</title>
<style>
  :root {
    --bg: #f5f3ee; --paper: #fffdf8; --ink: #1a1a1a; --ink-2: #555; --ink-3: #8a8a8a;
    --line: #e3ddd0; --accent: #a8321e; --accent-soft: rgba(168,50,30,.08);
    --ok: #2e7d4f; --ok-soft: rgba(46,125,79,.1);
    --err: #b3261e; --err-soft: rgba(179,38,30,.08); --warn: #b8860b;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --paper: #1f1e1b; --ink: #ece7dd; --ink-2: #b8b2a6; --ink-3: #7d786e;
      --line: #33312c; --accent: #e06a54; --accent-soft: rgba(224,106,84,.12);
      --ok: #6fcf97; --ok-soft: rgba(111,207,151,.14);
      --err: #ff8a80; --err-soft: rgba(255,138,128,.12); --warn: #d4a017;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 16px; line-height: 1.6; padding-bottom: env(safe-area-inset-bottom); min-height: 100vh;
  }
  button { font-family: inherit; }
  #loginScreen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .login-logo { font-size: 56px; margin-bottom: 8px; }
  .login-title { font-size: 28px; font-weight: 700; margin: 0 0 4px; letter-spacing: 4px; }
  .login-sub { color: var(--ink-3); font-size: 13px; margin-bottom: 36px; }
  .login-card { background: var(--paper); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); width: 100%; max-width: 360px; }
  .login-card label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; background: transparent; color: var(--ink); margin-bottom: 16px; outline: none; }
  .login-card input:focus { border-color: var(--accent); }
  .btn-primary { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .btn-primary:hover { opacity: .9; }
  .existing-users { margin-top: 20px; font-size: 13px; color: var(--ink-3); text-align: center; }
  .existing-users button { display: inline-block; margin: 4px; padding: 6px 14px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); border-radius: 16px; font-size: 13px; cursor: pointer; }
  #mainScreen { display: none; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-top)); }
  .title-row { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 2px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .user-chip button { background: transparent; border: 1px solid var(--line); color: var(--ink-2); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .progress-wrap { margin-top: 10px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  .progress-text { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  nav.bottom-tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
  nav.bottom-tabs button { flex: 1; background: transparent; border: none; color: var(--ink-3); padding: 8px; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.bottom-tabs button.active { color: var(--accent); }
  nav.bottom-tabs button .icon { font-size: 20px; }
  main { padding: 16px 16px 100px; max-width: 1280px; margin: 0 auto; }
  nav.chap-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 16px; }
  nav.chap-tabs button { flex: 0 0 auto; background: transparent; border: 1px solid var(--line); color: var(--ink-2); padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  nav.chap-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .quiz-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 860px) { .quiz-layout { grid-template-columns: 1fr; } }
  article.paper { background: var(--paper); border-radius: 12px; padding: 24px 28px; box-shadow: var(--shadow); align-self: start; }
  @media (min-width: 861px) { article.paper { position: sticky; top: 130px; max-height: calc(100vh - 150px); overflow-y: auto; } }
  article.paper h2 { font-family: "Songti SC", "STSong", serif; font-size: 19px; text-align: center; margin: 0 0 4px; font-weight: 700; }
  article.paper .author { text-align: center; color: var(--ink-3); font-size: 12px; margin-bottom: 18px; }
  article.paper .body { font-family: "Songti SC", "STSong", serif; font-size: 16px; line-height: 1.95; }
  article.paper .body p { margin: 0 0 12px; text-indent: 2em; }
  article.paper .body .qa-q { font-weight: 600; }
  article.paper .body .note { font-size: 12px; color: var(--ink-3); border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 14px; text-indent: 0; line-height: 1.6; }
  article.paper .poem { text-align: center; line-height: 2.2; }
  .q-list { display: flex; flex-direction: column; gap: 14px; }
  .q-card { background: var(--paper); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .q-num { background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .q-cat { font-size: 11px; color: var(--ink-3); }
  .q-stem { font-size: 15px; line-height: 1.75; margin: 0 0 12px; }
  .q-stem .sub-q { display: block; margin-top: 8px; color: var(--ink-2); }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.6; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; background: transparent; color: var(--ink); text-align: left; transition: all .15s; }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt .label { font-weight: 600; flex: 0 0 auto; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--err); background: var(--err-soft); }
  .opt.disabled { cursor: default; pointer-events: none; }
  .opt.disabled:hover { background: transparent; }
  .opt.disabled.correct:hover { background: var(--ok-soft); }
  .opt.disabled.wrong:hover { background: var(--err-soft); }
  .sp-box { margin-top: 10px; }
  .sp-box .sp-title { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
  .sp-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
  .sp-item.checked { border-color: var(--ok); background: var(--ok-soft); }
  .sp-item .checkbox { width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 4px; flex: 0 0 auto; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .sp-item.checked .checkbox { background: var(--ok); border-color: var(--ok); }
  .sp-score { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 6px; }
  .reveal-btn { background: var(--accent); color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 10px; }
  .answer-block { margin-top: 12px; padding: 12px 14px; background: var(--ok-soft); border-left: 3px solid var(--ok); border-radius: 0 6px 6px 0; font-size: 14px; line-height: 1.75; display: none; }
  .answer-block.show { display: block; }
  .answer-block .lbl { font-size: 12px; color: var(--ok); font-weight: 600; margin-bottom: 6px; }
  .answer-block p { margin: 0 0 6px; }
  .review-banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .review-banner .info { font-size: 14px; }
  .review-banner .info b { color: var(--accent); }
  .review-banner button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .wrong-item { background: var(--paper); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .wrong-item .wi-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .wrong-item .wi-stem { font-size: 14px; line-height: 1.6; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .dash-card { background: var(--paper); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .dash-card h3 { margin: 0 0 16px; font-size: 15px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .bar-row .bar-label { width: 80px; font-size: 13px; color: var(--ink-2); flex: 0 0 auto; }
  .bar-row .bar-track { flex: 1; height: 22px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; color: #fff; font-size: 11px; font-weight: 600; transition: width .5s; min-width: 30px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-cell { background: var(--bg); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-cell .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-cell .lbl { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-logo">📖</div>
  <h1 class="login-title">小阅读</h1>
  <div class="login-sub">语文阅读训练 · 个人专属错题本</div>
  <div class="login-card">
    <label>输入名字开始（或创建新用户）</label>
    <input type="text" id="usernameInput" placeholder="你的名字" maxlength="12">
    <button class="btn-primary" onclick="login()">进入</button>
    <div class="existing-users" id="existingUsers"></div>
  </div>
</div>

<div id="mainScreen">
  <header>
    <div class="title-row">
      <h1>小阅读</h1>
      <div class="user-chip">
        <span id="currentUserLabel"></span>
        <button onclick="logout()">切换</button>
        <button onclick="deleteAccount()">删除账号</button>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
    <div class="progress-text" id="progressText"></div>
  </header>
  <main>
    <div id="tab-quiz">
      <nav class="chap-tabs" id="chapTabs"></nav>
      <div class="quiz-layout">
        <article class="paper" id="article"></article>
        <div class="q-list" id="qList"></div>
      </div>
    </div>
    <div id="tab-wrong" class="hidden"></div>
    <div id="tab-dash" class="hidden"></div>
  </main>
  <nav class="bottom-tabs">
    <button class="active" data-tab="quiz" onclick="switchTab('quiz')"><span class="icon">📝</span>刷题</button>
    <button data-tab="wrong" onclick="switchTab('wrong')"><span class="icon">🔁</span>错题本</button>
    <button data-tab="dash" onclick="switchTab('dash')"><span class="icon">📊</span>仪表盘</button>
  </nav>
</div>

<script>
const PAPER = {
  sections: [
    {
      id: "s1", tab: "信息类", category: "信息类",
      article: {
        title: "种植入门问答", author: "黄岳渊、黄德邻《花经》（节选）",
        body: '<p><span class="qa-q">问一：</span>譬如种植一株树，或者一株花，如何能使之必然生活，而且会发荣滋长？</p><p><span class="qa-q">答：</span>如果这一株花或树，得来时并无重大损伤，且出土未久，未曾枯槁，依法种植，断无不能生活之理。</p><p><span class="qa-q">问二：</span>如何说是依法种植？</p><p><span class="qa-q">答：</span>第一须择天晴之候，泥土干燥，深耕浅种。如有多枝，勿使分枝之处埋入土内，将泥土桩实，浇足凉水，这水要使地下之土与盖上之土，和花树之根结成一体，是谓依法种植。</p><p><span class="qa-q">问三：</span>依理想而论，种植花树以阴雨天为宜，为何舍此不取，反要选择天晴之日？</p><p><span class="qa-q">答：</span>烈日之下，种植固非所宜，然须择晴天的早上或晚上。因为在雨天，泥土一经雨淋，容易成块，种植之后，不能与花树之根及加入之土融合凝结，以致中多空隙，根须不但不能发达，且易腐蚀。所以必求天晴之日，将干泥粉碎，加入根之四周，使无一处空隙，然后灌之以水，则花树之根能与泥土融成一片，是以种树必趁晴天。</p><p><span class="qa-q">问四：</span>……</p><p><span class="qa-q">答：</span>……</p><p><span class="qa-q">问五：</span>深耕浅种之说，如何解释？</p><p><span class="qa-q">答：</span>所谓深耕，即是种树之穴必掘之稍深，较种下之树根越一倍；种时仍将掘出之松泥，填入穴内，中部稍稍高起，这就指浅种。继乃将树根安置妥帖，而旋转一周，使泥土与根相洽。然后四周再加泥土，让其与穴外原有之泥土相和洽，于是稍加坚实，再浇足水，是谓深耕浅种。</p><p><span class="qa-q">问六：</span>必须深耕之理由安在？</p><p><span class="qa-q">答：</span>花树发达与否，全靠乎根，假使根须不能发达，花树亦不能发达。倘使种植时仅掘至应种之下而止，则根须不易发展，花树即不能繁荣，此为必须深耕之理由。</p><p><span class="qa-q">问七：</span>既深耕矣，深种有何妨碍，何以必须浅种？</p><p><span class="qa-q">答：</span>花与树之呼吸，在枝干与叶，如人之有口鼻，人苟闭塞口鼻，必致窒息。使花与树之枝干，深陷土内，亦必致窒息，此即不可深种之理由。</p><p><span class="qa-q">问八：</span>种植花树方法，尚有其他不可不知的条件否？</p><p><span class="qa-q">答：</span>尚有三端不可不明白：第一，种植花树的地位；第二，种植后的浇灌干湿；第三，施肥料的时期和浓淡。三端缺一，不能使种后之花树延长生命，而且也不能发达。</p><p><span class="qa-q">问九：</span>如何是地位？</p><p><span class="qa-q">答：</span>地位有两种，一种是方向，一种是高低。</p><p><span class="qa-q">问十：</span>方向应当如何？古人说是向阳的好，是否如此？</p><p><span class="qa-q">答：</span>这是不差的，但是也有较为喜阴的，即使喜阳的花树，长久晒在烈日之下，亦非所宜。</p><p><span class="qa-q">问十一：</span>高低又怎样解释？</p><p><span class="qa-q">答：</span>花树有喜干的，也有喜湿的，但即使喜湿的花树，如时常浸在水内，除浮萍水草等外，绝不能耐。所以种植花树之地，必较平地为高，使大雨之后，无积水之患。</p><p><span class="qa-q">问十二：</span>请问浇灌的干湿如何？</p><p><span class="qa-q">答：</span>浇灌必依天时的干湿而定：风和日暖，雨水调畅之时，不必浇灌；天晴较久，夜无露水，日间浇灌；炎夏烈日，每日浇灌，或晨夕各一次浇灌。浇灌必须在日尚未出，或日已没落时，地面热气全消，方为有益无害。不然，郁热之气，蕴蓄于根，易致腐烂。假使干湿难定，则自以较干为宜，常言道「湿不如干」，乃经验之谈也。</p><p><span class="qa-q">问十三：</span>请问施用肥料之时期和浓淡，如何方称适当？</p><p><span class="qa-q">答：</span>时期各有先后，然就普通而言，以立冬之后与立春之前，最为适宜。施用肥料，须在天晴之后，若在雨天肥料随流水而去，不但效用全无，且雨时根须已湿，加以肥料沾着易致腐烂。至于肥料浓淡以及肥料多少，常语曰「肥不如瘠」。如此观之，施肥不若淡而次数多为妙，湿时施干肥，干时施液肥可也。</p><p><span class="qa-q">问十四：</span>「湿不如干」「肥不如瘠」，依理想而论，似乎相反，请问理由安在？</p><p><span class="qa-q">答：</span>所谓湿干肥瘠，皆是过分而言。因为过干如经发觉，可以立刻浇灌而使之湿，过湿则不能立刻使之干也，肥瘠亦然。盖一则能补救，一则不能补救，此其理之一。过干过瘠之弊，花树枝叶至多暂时憔悴，一经发觉，实时浇水、上肥，尚可补救。过湿过肥，其病先在于根，根已腐烂，枝叶尚繁茂，及至根部腐烂殆尽，枝叶变化，补救已无及矣，此其理之二。</p><p><span class="qa-q">问十五：</span>除以上问答外，尚有不可不知之事理否？</p><p><span class="qa-q">答：</span>尚有一端为入门不可不知者，余常谓培植花树，与教育儿童无异。教育儿童的最要条件，为多注意，少干涉。假使少注意，而多干涉，不但于儿童身心无益处，反多弊害也。种植花树亦然，一花一树，既经依法种植之后，须时时留意，有无害虫滋蔓，或风吹、雨打、日炙、霜侵，有则及时补救。切不可时常移植，攀折摇动，使之不能安定，如此则自然枝叶茁发，花果丰饶。而所谓入门，亦尽于此矣。</p><p class="note">（摘编自黄岳渊、黄德邻《花经》）</p>'
      },
      questions: [
        { id: "s1q1", type: "single", category: "信息类",
          stem: "下列对原文相关内容的理解和分析，正确的一项是（ ）",
          options: [
            "阴天或下雨时种植花木，浇水量、施肥量过多，炎炎烈日每日浇灌，这些情况往往易导致植物的根部腐烂。",
            "问三和问十四均用「依理想而论」对回答者的观点表示不解和疑问，回答者进行了解释，指出提问者原有认知的不合理之处。",
            "问八的回答「尚有三端」以及问十五的回答「尚有一端」，这些内容可作为问六「必须深耕之理由安在」这一问题的补充。",
            "问一到问三以及问五到问七讨论的是花木在种植过程中的存活问题，问八到问十五讨论的是花木移植到固定的地方后培育的注意事项。"

        body: '<p style="text-align:center;font-weight:600;text-indent:0;margin-bottom:10px;">文本一：鼓书艺人（节选）</p><p>一九三八年夏，汉口战局吃紧。</p><p>浑浊的长江，浩浩荡荡地往东奔流。形形色色的难民，历尽了人间苦难，正没命地朝着相反的方向奔逃。翅膀下贴着红膏药的飞机，一个劲儿地扔炸弹。炸弹发出揪心的咝咝声往下落，一掉进水里，就溅起混着血的冲天水柱。</p><p>一只叫作「民生」的白色小江轮，满载着难民，正沿江而上，开往重庆。船上的烟囱突突地冒着黑烟，慢慢开进了「七十二滩」的第一滩，两岸的悬崖峭壁，把江水紧紧挤在中间。</p><p>房舱和统舱里都挤满了人，甲板上也是水泄不通。在浓烟直冒的烟囱底下，有五六十个小孩子，手足无措地紧紧挤在一起。他们已经没了家，没了父母，浑身都是煤烟和尘土，就像刚打煤堆里钻出来一样。</p><p>湍急的长江，两岸怪石林立，江水像条怒龙，发狂地在两山之间扭来扭去。过了一道险滩，紧接着又是一道，然后直泻而下。船在江面上颠来簸去，像一条毛毛虫在挣命。</p><p>太阳一落到峭崖的背后，寒风就吹得乘客们直打战。偶尔一线阳光从岩石缝里漏过来，在汹涌的江面上投下一道彩虹，美得出奇。</p><p><b>大江两岸，座座青山，处处陡坡，都有自己的名字。它们千姿万态，构成一幅无穷无尽的画卷。古往今来，多少人讴歌江上变幻莫测的美景，多少人吟咏过有关它的神奇传说。楚怀王和巫山神女幽会的古迹犹存。可是这些逃难的旅客已顾不得这些，当江轮穿过巫峡，打绝代佳人——神女峰面前驶过时，他们都毫不动心。</b></p><p>难民们没闲心，也没立足的地方，没法凭栏观景致。所有乘客，不分老少贵贱，都被眼前的危险和茫茫前途吓住了。特别使人难受的，是生活上的不便。</p><p>在「民生」轮上，谁心里也不平静，人们不是烦恼，就是生气，悲伤。两岸美丽的青山映入眼帘也振奋不了他们。生活太无情，真是遭不完的罪孽，说不尽的伤心。</p><p>乘客中看来只有一个人是既不悲伤，也不发愁。这人就是方宝庆，四十开外，他靠一面大鼓、一副鼓板和一把三弦，在茶馆里唱大鼓、说评书吃饭。他是个走江湖卖艺的，大半生带着全家走南闯北。日本人进了北平，宝庆带着全家去上海。上海沦陷了，他们又到汉口。如今敌人进逼到汉口市郊了，他和全家又跟大伙儿一起往重庆逃。北平是宝庆的家。他唱的大鼓，全是京韵的。他要想留在北平很容易，用不着遭这么大罪，受这么多苦。他不明白自己是不是爱国，可是他宁愿丢下舒舒服服的家和心爱的东西，不愿在飘着日本旗的城里挣钱吃饭。</p><p>上了「民生」不到几个钟头，他就认得了几乎同船的人。没过多久，船的每个角落他都熟悉，什么东西在哪里，他都知道。要是他实在找不到别的事情可干，就顺着狭窄的铁梯，爬上甲板，看看烟囱下面那些没人管的，满身是煤烟的小孩儿。</p><p>宝庆看到这些一身煤烟的可怜孩子，觉着心疼。看着他们，想起他说过的那些动人心弦的故事，他体会得出这些可怜的小家伙在大乱中失去爹娘时的那份伤心劲儿。</p><p>他希望能拿出三百四个热腾肉包子来，给这些面带病容的黑乎乎的小宝贝儿吃。可是有什么法子，他什么也拿不出。他想给孩子们唱上一段，可是心里直翻腾，开不了口。他跑江湖卖唱，多年学来的要来就来的笑容和容易交朋友的习惯，在这些遭难的孩子面前，一点儿也使不上。他一言不发，傻里傻气地站着发愣。突突冒烟的烟囱里落下来的黑煤灰，在他那没戴帽子的秃头上，慢慢地积了厚厚的一层。</p><p>听见下面甲板上传来欢呼声，他像从梦中醒来，往下看，乘客们都在高兴，因为船已经驶过了最后一道险滩。两岸只有平缓的山坡，江面变得又开阔，又平静。</p><p>船拢岸时，西边天上的太阳已经现出金红色。一时间谁也没动。那些驾着船安然穿过险滩的船长和领港，那些瞧着他们的茶房和乘客，一个个都累得不想动了。</p><p>宝庆掸了掸光头上的煤灰，张大了嘴，大声对孩子们叫道：「来，快来，都来，洗个澡。」他推开人群，领着孩子们走过跳板，像赶一群鸭子，扑通扑通地跳进水里。</p><p class="note">（马小弥译，有删改）</p>'

        body: '<p style="font-weight:600;text-indent:0;">材料一</p><p>郑伯如晋，子大叔相，见范献子。献子曰：「若王室何？」对曰：「老夫其国家不能恤，敢及王室？抑人亦有言曰：嫠不恤其纬，而忧宗周之陨，为将及焉。今王室实蠢蠢焉，吾小国惧矣，然大国之忧也，吾侪何知焉？吾子其早图之。」</p><p class="note">（节选自《左传·昭公二十四年》）</p><p style="font-weight:600;text-indent:0;">材料二</p><p>漆室女者，鲁漆室邑之女也。当穆公时，君老，太子幼。女倚柱而啸，旁人闻之，莫不为之惨者。其邻人妇从之游，谓曰：「何啸之悲也？」漆室女曰：「吾忧鲁君老，太子幼。」邻妇笑曰：「此乃鲁大夫之忧，妇人何与焉！」漆室女曰：「不然，非子所知也。昔晋客舍吾家，系马园中。马佚驰走，践吾葵，使我终岁不食葵。邻人女奔，随人亡，其家倩吾兄追之。逢霖水出，溺流而死，令吾终身无兄。<b>今鲁君老悖，太子少愚，愚伪日起。夫鲁国有患者君臣父子皆被其辱祸及众庶妇人独安所避乎！</b>吾甚忧之。」</p><p class="note">（节选自刘向《列女传》卷三）</p><p style="font-weight:600;text-indent:0;">材料三</p><p>鲁监门之女婴相从绩，中夜而泣涕。其偶曰：「何谓而泣也？」婴曰：「吾闻卫世子不肖，所以泣也。」其偶曰：「卫世子不肖，诸侯之忧也，子曷为泣也？」婴曰：「吾闻之异乎子之言也。昔者宋之桓司马得罪于宋君，出于鲁，其马佚而辚吾园，而食吾园之葵。是岁，吾闻园人亡利之半。越王勾践起兵而攻吴，诸侯畏其威，鲁往献女，吾姊与焉，兄往视之，道畏而死。越兵威者，吴也；兄死者，我也。今卫世子甚不肖，好兵，吾男弟三人，能无忧乎？」</p><p class="note">（节选自韩婴《韩诗外传》卷二）</p><p style="font-weight:600;text-indent:0;">材料四</p><p>战国之时，说客辩士尤好借物以喻其意，非以为实有此事也，乃汉晋著述者往往误以为实事而采之入书。《春秋传》子大叔云「嫠不恤其纬，而忧宗周之陨，为将及焉」，此不过设言耳。其后衍之，遂谓漆室之女不绩其麻而忧鲁国；其后又衍之，遂谓鲁监门之女婴忧卫世子之不肖。而有「终岁不食葵」「终身无兄」之言，若真有其人其事者矣。由是韩婴竟采之以入《诗外传》，刘向采之以入《列女传》。传之益久，信者愈多，遂至虚言竟成实事。万世之士但见汉人之书有之，遂信之而不疑，抑亦过矣。</p><p class="note">（节选自崔述《考信录》）</p>'

const USERS_KEY = "xyuedu_users";
const CURRENT_KEY = "xyuedu_current";
function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || "[]"); }
function setUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getCurrentUser() { return localStorage.getItem(CURRENT_KEY); }
function setCurrentUser(u) { localStorage.setItem(CURRENT_KEY, u); }
function dataKey(u) { return "xyuedu_data_" + u; }
function loadData(u) { return JSON.parse(localStorage.getItem(dataKey(u)) || '{"answers":{},"wrong":[]}'); }
function saveData(u, d) { localStorage.setItem(dataKey(u), JSON.stringify(d)); }

function renderExistingUsers() {
  const users = getUsers();
  const el = document.getElementById("existingUsers");
  if (!users.length) { el.innerHTML = ""; return; }
  el.innerHTML = "或选择已有用户：<br>" + users.map(function(u){ return "<button onclick='quickLogin(\"" + u + "\")'>" + u + "</button>"; }).join("");
}
function login() {
  const name = document.getElementById("usernameInput").value.trim();
  if (!name) { alert("请输入名字"); return; }
  const users = getUsers();
  if (users.indexOf(name) < 0) { users.push(name); setUsers(users); }
  setCurrentUser(name);
  enterMain();
}
function quickLogin(name) { setCurrentUser(name); enterMain(); }
function logout() { if (confirm("切换用户？")) { localStorage.removeItem(CURRENT_KEY); location.reload(); } }
function deleteAccount() {
  const u = getCurrentUser();
  if (!confirm("确定删除账号「" + u + "」？所有答题记录和错题本将被清空。")) return;
  let users = getUsers().filter(function(x){ return x !== u; });
  setUsers(users);
  localStorage.removeItem(dataKey(u));
  localStorage.removeItem(CURRENT_KEY);
  location.reload();
}

let currentUser = null;
let data = null;
let currentChap = 0;
let currentTab = "quiz";

function enterMain() {
  currentUser = getCurrentUser();
  data = loadData(currentUser);
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainScreen").style.display = "block";
  document.getElementById("currentUserLabel").textContent = currentUser;
  renderAll();
}

function allQuestions() {
  const arr = [];
  PAPER.sections.forEach(function(s){ s.questions.forEach(function(q){ arr.push(q); }); });
  return arr;
}
function findQ(qid) { return allQuestions().find(function(q){ return q.id === qid; }); }

function renderChapTabs() {
  const el = document.getElementById("chapTabs");
  el.innerHTML = "";
  PAPER.sections.forEach(function(s, i){
    const b = document.createElement("button");
    b.textContent = s.tab;
    if (i === currentChap) b.classList.add("active");
    b.onclick = function(){ currentChap = i; renderAll(); };
    el.appendChild(b);
  });
}

function renderArticle() {
  const s = PAPER.sections[currentChap];
  document.getElementById("article").innerHTML = "<h2>" + s.article.title + "</h2><div class='author'>" + s.article.author + "</div><div class='body'>" + s.article.body + "</div>";
}

function renderQuiz() {
  const s = PAPER.sections[currentChap];
  const el = document.getElementById("qList");
  el.innerHTML = "";
  s.questions.forEach(function(q){
    const st = data.answers[q.id] || { chosen: null, revealed: false, sp: [] };
    const card = document.createElement("div");
    card.className = "q-card";
    if (q.type === "single") {
      const optsHtml = q.options.map(function(opt, i){
        let cls = "opt";
        if (st.chosen !== null) {
          cls += " disabled";
          if (i === q.answer) cls += " correct";
          else if (i === st.chosen) cls += " wrong";
        }
        return '<button class="' + cls + '" data-q="' + q.id + '" data-i="' + i + '"><span class="label">' + "ABCD"[i] + ".</span><span>" + opt + "</span></button>";
      }).join("");
      card.innerHTML = '<div class="q-head"><span class="q-num">' + q.id.toUpperCase() + '</span><span class="q-cat">' + q.category + ' · 单选题</span></div><p class="q-stem">' + q.stem + '</p><div class="options">' + optsHtml + '</div><div class="answer-block ' + (st.chosen !== null ? "show" : "") + '"><div class="lbl">答案与解析</div><p><b>答案：' + "ABCD"[q.answer] + '</b></p><p>' + q.analysis + '</p></div>';
    } else {
      const spHtml = q.scoringPoints.map(function(sp, i){
        return '<div class="sp-item ' + (st.sp.indexOf(i) >= 0 ? "checked" : "") + '" data-sp="' + q.id + '" data-i="' + i + '"><div class="checkbox">' + (st.sp.indexOf(i) >= 0 ? "✓" : "") + '</div><span>' + sp + '</span></div>';
      }).join("");
      const hitCount = st.sp.length;
      const totalCount = q.scoringPoints.length;
      card.innerHTML = '<div class="q-head"><span class="q-num">' + q.id.toUpperCase() + '</span><span class="q-cat">' + q.category + ' · 主观题</span></div><p class="q-stem">' + q.stem + '</p><div style="border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin-bottom:10px;">✍️ 先自己作答，写完后对照参考答案勾选你踩中的采分点。</div><button class="reveal-btn" data-reveal="' + q.id + '">' + (st.revealed ? "收起参考答案" : "显示参考答案") + '</button><div class="answer-block ' + (st.revealed ? "show" : "") + '"><div class="lbl">参考答案 / 解析</div>' + q.answer + '<p style="margin-top:8px;color:var(--ink-2);font-size:13px;">💡 ' + q.analysis + '</p></div>' + (st.revealed ? '<div class="sp-box"><div class="sp-title">👇 你踩中了哪些采分点？</div>' + spHtml + '<div class="sp-score">已勾选 ' + hitCount + ' / ' + totalCount + '</div></div>' : "");
    }
    el.appendChild(card);
  });
  el.querySelectorAll(".opt").forEach(function(btn){
    btn.onclick = function(){
      const qid = btn.dataset.q, i = parseInt(btn.dataset.i);
      const st = data.answers[qid] = data.answers[qid] || { chosen: null, revealed: false, sp: [] };
      if (st.chosen !== null) return;
      st.chosen = i;
      const q = findQ(qid);
      if (i === q.answer) removeWrong(qid); else addWrong(qid);
      saveData(currentUser, data);
      renderAll();
    };
  });
  el.querySelectorAll("[data-reveal]").forEach(function(btn){
    btn.onclick = function(){
      const qid = btn.dataset.reveal;
      const st = data.answers[qid] = data.answers[qid] || { chosen: null, revealed: false, sp: [] };
      st.revealed = !st.revealed;
      saveData(currentUser, data);
      renderAll();
    };
  });
  el.querySelectorAll(".sp-item").forEach(function(item){
    item.onclick = function(){
      const qid = item.dataset.sp, i = parseInt(item.dataset.i);
      const st = data.answers[qid];
      const idx = st.sp.indexOf(i);
      if (idx >= 0) st.sp.splice(idx, 1); else st.sp.push(i);
      const q = findQ(qid);
      if (st.sp.length < q.scoringPoints.length) addWrong(qid); else removeWrong(qid);
      saveData(currentUser, data);
      renderAll();
    };
  });
}

const SRS_INTERVALS = [1, 3, 7, 15];
function addWrong(qid) {
  if (data.wrong.find(function(w){ return w.qid === qid; })) return;
  data.wrong.push({ qid: qid, nextReview: Date.now() + SRS_INTERVALS[0]*86400000, streak: 0, times: 0 });
}
function removeWrong(qid) { data.wrong = data.wrong.filter(function(w){ return w.qid !== qid; }); }
function getDueWrong() { const now = Date.now(); return data.wrong.filter(function(w){ return w.nextReview <= now; }); }

function renderWrong() {
  const el = document.getElementById("tab-wrong");
  const due = getDueWrong();
  const total = data.wrong.length;
  let html = "";
  if (due.length > 0) {
    html += '<div class="review-banner"><div class="info">今日有 <b>' + due.length + '</b> 道题需要复习</div><button onclick="startReview()">开始复习</button></div>';
  }
  if (total === 0) {
    html = '<div class="empty-state"><div class="icon">🎉</div><p>太棒了，暂无错题</p></div>';
  } else {
    html += '<h3 style="font-size:14px;color:var(--ink-3);margin:16px 0 10px;">全部错题（' + total + '）</h3>';
    data.wrong.forEach(function(w){
      const q = findQ(w.qid);
      const dueStr = w.nextReview <= Date.now() ? "今日复习" : new Date(w.nextReview).toLocaleDateString("zh-CN");
      const stemText = q.stem.replace(/<[^>]+>/g, "").slice(0, 80);
      html += '<div class="wrong-item"><div class="wi-head"><span>' + q.category + ' · ' + (q.type === "single" ? "单选" : "主观") + '</span><span>' + dueStr + '</span></div><div class="wi-stem">' + stemText + '...</div></div>';
    });
  }
  el.innerHTML = html;
}

function startReview() {
  const due = getDueWrong();
  if (due.length === 0) return;
  const firstQ = findQ(due[0].qid);
  const secIdx = PAPER.sections.findIndex(function(s){ return s.questions.some(function(q){ return q.id === firstQ.id; }); });
  currentChap = secIdx;
  switchTab("quiz");
  alert("复习提醒：请在下方完成错题。做对后自动记录，连续两次做对将移出错题本。");
}

function renderDash() {
  const el = document.getElementById("tab-dash");
  const cats = ["信息类", "文学类", "文言文", "古诗"];
  const stats = {};
  cats.forEach(function(c){ stats[c] = { total: 0, correct: 0, attempted: 0 }; });
  allQuestions().forEach(function(q){
    stats[q.category].total++;
    const st = data.answers[q.id];
    if (!st) return;
    stats[q.category].attempted++;
    if (q.type === "single" && st.chosen !== null) {
      if (st.chosen === q.answer) stats[q.category].correct++;
    } else if (q.type === "subjective" && st.revealed) {
      const hit = st.sp.length;
      const total = q.scoringPoints.length;
      if (total > 0) stats[q.category].correct += hit / total;
    }
  });
  const totalQ = allQuestions().length;
  const attemptedQ = Object.keys(data.answers).length;
  const wrongCount = data.wrong.length;
  let barsHtml = "";
  cats.forEach(function(c){
    const s = stats[c];
    const pct = s.attempted > 0 ? Math.round(s.correct / s.attempted * 100) : 0;
    const color = pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--err)";
    barsHtml += '<div class="bar-row"><div class="bar-label">' + c + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(pct,5) + '%;background:' + color + ';">' + pct + '%</div></div></div>';
  });
  el.innerHTML = '<div class="dash-card"><h3>总览</h3><div class="stat-grid"><div class="stat-cell"><div class="num">' + attemptedQ + '</div><div class="lbl">已做题数</div></div><div class="stat-cell"><div class="num">' + wrongCount + '</div><div class="lbl">待复习错题</div></div><div class="stat-cell"><div class="num">' + Math.round(attemptedQ/totalQ*100) + '%</div><div class="lbl">完成度</div></div></div></div><div class="dash-card"><h3>各类别正确率</h3>' + barsHtml + '<p style="font-size:12px;color:var(--ink-3);margin-top:12px;">💡 绿色 ≥80%，黄色 60-80%，红色 &lt;60%。主观题按采分点命中率折算。</p></div>';
}

function updateProgress() {
  const total = allQuestions().length;
  let done = 0;
  allQuestions().forEach(function(q){
    const st = data.answers[q.id];
    if (!st) return;
    if (q.type === "single" && st.chosen !== null) done++;
    if (q.type === "subjective" && st.revealed) done++;
  });
  document.getElementById("bar").style.width = (done/total*100) + "%";
  document.getElementById("progressText").textContent = currentUser + " · 已答 " + done + " / " + total + " · 错题 " + data.wrong.length;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll("nav.bottom-tabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === tab); });
  document.getElementById("tab-quiz").classList.toggle("hidden", tab !== "quiz");
  document.getElementById("tab-wrong").classList.toggle("hidden", tab !== "wrong");
  document.getElementById("tab-dash").classList.toggle("hidden", tab !== "dash");
  renderAll();
  window.scrollTo({ top: 0 });
}

function renderAll() { renderChapTabs(); renderArticle(); renderQuiz(); renderWrong(); renderDash(); updateProgress(); }

renderExistingUsers();
if (getCurrentUser()) { enterMain(); }
</script>
